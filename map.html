<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOUPS 2026 — Hannover map</title>
<link rel="stylesheet" href="_ds/broadsheet-f75e36a9-287e-4ae1-8947-5158a447224a/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  #map { position: absolute; inset: 0; background: var(--color-neutral-200); }
  .leaflet-container { font-family: var(--font-body); }
  .leaflet-popup-content-wrapper { border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); box-shadow: var(--shadow-lg); }
  .leaflet-popup-content { margin: var(--space-3); font-size: 15px; line-height: 1.45; }
  .leaflet-popup-tip { background: var(--color-bg); }
  .pk { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--color-accent-700); }
  .pt { font-size: 19px; font-weight: 600; margin: 2px 0 4px; line-height: 1.2; }
  .pm { color: var(--color-neutral-700); font-size: 14px; }
  .pa { display: inline-block; margin-top: var(--space-2); color: var(--color-accent-700); font-weight: 600; text-decoration: none; border-bottom: 1px solid currentColor; }
  .pa:hover { color: var(--color-accent-600); }
  .pin { display: block; border-radius: 50%; border: 2px solid var(--color-bg); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .legend { background: var(--color-bg); padding: var(--space-2) var(--space-3); box-shadow: var(--shadow-md); border-radius: var(--radius-md); font-size: 13px; line-height: 1.9; }
  .legend b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--color-neutral-700); margin-bottom: 2px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 7px; vertical-align: 1px; }
  a:focus-visible, .leaflet-control a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const VENUE = [52.38269, 9.71818];
const CAT = {
  venue:  { color: '#d6006c', label: 'Conference venue' },
  nature: { color: '#0088b0', label: 'Nature & wildlife' },
  sport:  { color: '#006786', label: 'Sports & action' },
  food:   { color: '#edbb00', label: 'Dining & bars' }
};
// Tuple order: [cat, name, addr, meta, lat, lon, id] — id is the join key to
// the host app's `places` slugs (index.html), used for filter sync.
const PLACES = [
  ['venue','Leibniz University Hannover','Welfengarten 1, 30167 Hannover','SOUPS 2026 · Welfenschloss',52.38269,9.71818,'venue'],
  ['nature','Herrenhausen Gardens','Herrenhäuser Str. 4, 30419 Hannover','~1.7 km · 10 min by tram 4/5',52.39080,9.69770,'herrenhausen'],
  ['nature','SEA LIFE Hannover','Herrenhäuser Str. 4a, 30419 Hannover','~1.7 km · 10 min by tram 4/5',52.39265,9.69900,'sealife'],
  ['nature','Maschsee','Rudolf-von-Bennigsen-Ufer, 30169 Hannover','~2.8 km · 15 min by tram',52.36090,9.74000,'maschsee'],
  ['nature','Erlebnis-Zoo Hannover','Adenauerallee 3, 30175 Hannover','~3.6 km · 20 min by tram + bus',52.38107,9.77074,'zoo'],
  ['nature','Eilenriede — Waldstation','Kleestraße 81, 30625 Hannover','Forest edge ~2 km · Waldstation ~4.9 km',52.38990,9.78888,'eilenriede'],
  ['sport','Beta Boulderhalle','Gertrud-Knebusch-Str. 15, 30167 Hannover','~900 m · 12 min walk',52.38510,9.73120,'beta'],
  ['sport','NeonGolf Hannover','Heiligerstraße 15-16, 30159 Hannover','~1.5 km · 19 min walk',52.37440,9.73551,'neongolf'],
  ['sport','Leine-Welle','Schloßstraße, 30159 Hannover','~1.5 km · 20 min walk',52.37130,9.73128,'leinewelle'],
  ['sport','Jump One Hannover','Weidendamm 2, 30167 Hannover','~1.0 km · 13 min walk',52.38469,9.73226,'jumpone'],
  ['sport','HI-Score','Anna-Zammert-Straße 28, 30171 Hannover','~3.8 km · 20 min by tram · Fri–Sun only',52.36429,9.76371,'hiscore'],
  ['food','Bavarium Hannover','Windmühlenstraße 6, 30159 Hannover','~1.9 km · 10 min by tram',52.37201,9.73955,'bavarium'],
  ['food','Waterloo Biergarten','Waterloostraße 1, 30169 Hannover','~1.9 km · 24 min walk',52.36826,9.73179,'waterloo'],
  ['food','Strandleben','Weddigenufer 25, 30167 Hannover','~700 m · 9 min walk',52.37722,9.71311,'strandleben'],
  ['food','Extrakt','Hahnenstraße 3, 30167 Hannover','~450 m · 6 min walk',52.38663,9.71988,'extrakt'],
  ['food','Destille','Im Moore 3, 30167 Hannover','~240 m · 3 min walk',52.38251,9.72163,'destille'],
  ['food','Santana Cocktailbar','Rehbockstraße 38A, 30167 Hannover','~400 m · 5 min walk',52.38636,9.71708,'santana'],
  ['food','E-Damm','Engelbosteler Damm, 30167 Hannover','~800 m · 11 min walk',52.38745,9.72310,'edamm'],
  ['food','Francesca & Fratelli','Seilwinderstraße 2, 30159 Hannover','~1.7 km · 21 min walk',52.37241,9.73613,'francesca'],
  ['food','Kaisers','Schaufelder Straße 27, 30167 Hannover','~650 m · 8 min walk',52.38844,9.71647,'kaisers']
];

const map = L.map('map', { center: VENUE, zoom: 14, zoomControl: true, scrollWheelZoom: true });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

const group = [];
const markers = {};
PLACES.forEach(([cat, name, addr, meta, lat, lon, id]) => {
  const isVenue = cat === 'venue';
  const d = isVenue ? 22 : 15;
  const icon = L.divIcon({
    className: '',
    iconSize: [d, d],
    iconAnchor: [d / 2, d / 2],
    html: '<span class="pin" style="width:' + d + 'px;height:' + d + 'px;background:' + CAT[cat].color + (isVenue ? ';border-width:3px' : '') + '"></span>'
  });
  const dir = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(addr);
  const m = L.marker([lat, lon], { icon, title: name, riseOnHover: true, keyboard: true }).addTo(map);
  m.bindPopup(
    '<div class="pk">' + CAT[cat].label + '</div>' +
    '<div class="pt">' + name + '</div>' +
    '<div class="pm">' + meta + '<br>' + addr + '</div>' +
    '<a class="pa" href="' + dir + '" target="_blank" rel="noopener">Directions ↗</a>'
  );
  m.bindTooltip(name, { direction: 'right', offset: [10, 0], opacity: 0.95 });
  markers[id] = m;
  group.push([lat, lon]);
});

map.fitBounds(L.latLngBounds(group).pad(0.06));

const legend = L.control({ position: 'bottomleft' });
legend.onAdd = () => {
  const el = L.DomUtil.create('div', 'legend');
  el.innerHTML = '<b>SOUPS 2026 · Hannover</b>' + Object.values(CAT)
    .map((c) => '<div><i style="background:' + c.color + '"></i>' + c.label + '</div>').join('');
  return el;
};
legend.addTo(map);

// filterSet is the set of place ids to show (null = show everything).
let filterSet = null;
function applyFilter() {
  PLACES.forEach(([cat, , , , , , id]) => {
    const m = markers[id];
    if (!m) return;
    const show = cat === 'venue' || !filterSet || filterSet.has(id);
    if (show) { if (!map.hasLayer(m)) m.addTo(map); }
    else if (map.hasLayer(m)) map.removeLayer(m);
  });
}

// Host messages: focus one place, or sync the global filter's visible set.
addEventListener('message', (e) => {
  const d = e.data;
  if (!d) return;
  if (d.focus) {
    const p = PLACES.find((x) => x[1] === d.focus);
    if (p) map.setView([p[4], p[5]], 16, { animate: true });
  }
  if (Array.isArray(d.filter)) {
    filterSet = new Set(d.filter);
    applyFilter();
  }
});

// Tell the host we're ready so it can push the current filter into a freshly
// (lazily) loaded iframe.
try { parent.postMessage({ mapReady: true }, '*'); } catch (e) {}
</script>
</body>
</html>
